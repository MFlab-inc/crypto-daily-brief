name: _diag-tier4-reuters-investigate

# tier4/Reuters見直し（オーナー指示）の調査専用の一時ワークフロー。
# Google News RSSの生XML構造（<source>タグの有無・<link>の実体）を
# 実データで確認する。LLMは呼ばない。コミットは一切行わない。
# 調査完了後、スクリプトとあわせて削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: |
          pip install -q -r requirements.txt

      - name: 診断スクリプト実行(実RSS取得・LLM呼び出しなし・コミットしない)
        run: |
          python scripts/_diag_tier4_reuters_investigate.py
