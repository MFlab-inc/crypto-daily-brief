name: _diag-boj-adp-rss-investigate2

# 日銀・ADP RSS調査のフォローアップ（オーナー指示・急ぎではない）。
# fetch_article_body()の実挙動確認とADP RSSフィードの内容検証。
# LLMは呼ばない。コミットは一切行わない。調査完了後、スクリプトと
# あわせて削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: |
          pip install -q -r requirements.txt

      - name: 診断スクリプト実行(実RSS/HTML取得・LLM呼び出しなし・コミットしない)
        run: |
          python scripts/_diag_boj_adp_rss_investigate2.py
