name: _diag_20260909_inspect_0908_draft

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: post-draft-2026-09-08
          path: draft-0908
          run-id: 34286813636
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: draft内容とC23で検知された'Index'の文脈を確認
        run: |
          echo "===== ファイル一覧 ====="
          find draft-0908 -type f
          echo ""
          echo "===== part2.md ====="
          cat draft-0908/part2.md || true
          echo ""
          echo "===== post_audit（C23詳細） ====="
          cat draft-0908/post_audit_20260908.json || true
          echo ""
          echo "===== 'Index'の出現箇所（post_bundle.json全体） ====="
          grep -n "Index" draft-0908/post_bundle.json || echo "post_bundle.jsonに'Index'なし"
