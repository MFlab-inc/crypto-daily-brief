name: _diag-cmc-ohlcv

# 対策2（日中高値・安値取得）の実装前調査専用の一時ワークフロー。
# 恒久機能ではない。調査完了後、スクリプトとあわせて削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: |
          pip install -q -r requirements.txt

      - name: 診断スクリプト実行
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          python scripts/_diag_cmc_ohlcv.py
