name: _diag-google-news

# Google News RSS 0件問題調査専用の一時ワークフロー。恒久機能ではない。
# 実際のnews.google.comへリクエストを送るが、コミットは一切行わない。
# 調査完了後、スクリプトとあわせて削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: |
          pip install -q -r requirements.txt

      - name: 診断スクリプト実行（news.google.comへの実リクエスト・コミットしない）
        run: |
          python scripts/_diag_google_news.py
