name: _diag_20260908_liquid_network

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: pip install -q -r requirements.txt

      - name: Liquid Network取りこぼし調査（実RSS取得・非破壊）
        run: python scripts/_diag_20260908_liquid_network.py
