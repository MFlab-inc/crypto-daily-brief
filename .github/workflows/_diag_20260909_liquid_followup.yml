name: _diag_20260909_liquid_followup

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: pip install -q -r requirements.txt

      - name: 9/8 Liquid Network続報の選定調査（非破壊）
        run: python scripts/_diag_20260909_liquid_followup.py
