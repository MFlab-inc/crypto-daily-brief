name: diag-followup-body-and-pairing

# 一時的な調査用ワークフロー（8/25実データで判明した2つの構造的問題の
# 追試・オーナー指示）。本番パイプライン（daily.yml・set_headline.yml・
# post_draft.yml）には一切影響しない。
# 調査完了後、本ファイルとscripts/_diag_followup_body_and_pairing.pyは
# 削除する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: pip install -q -r requirements.txt

      - name: HTMLParserによる本文抽出・overlap係数によるtier3ペア検出を検証
        run: python3 scripts/_diag_followup_body_and_pairing.py
