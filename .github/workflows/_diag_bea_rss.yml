name: _diag-bea-rss

# BEA RSS到達性調査専用の一時ワークフロー。恒久機能ではない。
# 調査完了後、スクリプトとあわせて削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: |
          pip install -q requests

      - name: BEA RSS到達性を確認
        run: |
          python scripts/_diag_bea_rss.py
