name: _diag_20260907_apr_capture

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps firefox

      - name: 診断実行
        run: python scripts/_diag_20260907_apr_capture.py

      - name: 画像アーティファクト保存（成否によらず）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-apr-capture
          path: |
            /tmp/_diag_apr_screenshot.jpg
            /tmp/_diag_apr_screenshot.full.png
            /tmp/apr_capture_status.json
          if-no-files-found: ignore
