name: diag-headline-verify

# 一時的な調査用ワークフロー（v1.30「ヘッドラインの判定手順」追加の効果を
# 2026-08-21・2026-08-22の実データで検証）。本番パイプライン（daily.yml・
# set_headline.yml・post_draft.yml）には一切影響しない。
# 調査完了後、本ファイルとscripts/_diag_headline_verify.pyは削除する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: pip install -q -r requirements.txt

      - name: ヘッドライン判定手順の効果を8/21・8/22の実データで検証
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/_diag_headline_verify.py
