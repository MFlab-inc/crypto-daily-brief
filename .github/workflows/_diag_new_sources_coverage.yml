name: diag-new-sources-coverage

# 一時的な調査用ワークフロー（v1.31で追加した米財務省・USTR・ホワイトハウスが
# 2026-08-20・2026-08-22の実際の材料を拾えるかを検証）。本番パイプライン
# （daily.yml・set_headline.yml・post_draft.yml）には一切影響しない。
# 調査完了後、本ファイルとscripts/_diag_new_sources_coverage.pyは削除する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: pip install -q -r requirements.txt

      - name: 新規tier1情報源が8/20・8/22の対象材料を拾えるか検証
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/_diag_new_sources_coverage.py

      - name: 新規4情報源の生の取得結果（日付フィルタなし）を出力
        run: python3 scripts/_diag_raw_feed_contents.py
