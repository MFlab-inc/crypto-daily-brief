name: diag-etf-source-verify

# 一時的な調査用ワークフロー（オーナー指示によるFarside Investors・
# SoSoValueのETFフロー機械可読取得可否の実測調査）。本番パイプライン
# （daily.yml・set_headline.yml・post_draft.yml）には一切影響しない。
# 調査完了後、本ファイルとscripts/_diag_etf_source_verify.pyは削除する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: pip install -q -r requirements.txt

      - name: Farside/SoSoValueの到達性を実測
        run: python3 scripts/_diag_etf_source_verify.py
