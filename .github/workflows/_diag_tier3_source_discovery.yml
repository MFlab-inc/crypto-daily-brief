name: diag-tier3-source-discovery

# 一時的な調査用ワークフロー（オーナー指示によるBloomberg日本語版・
# 日本経済新聞・時事通信の公式RSS URL調査）。本番パイプライン
# （daily.yml・set_headline.yml・post_draft.yml）には一切影響しない。
# 調査完了後、本ファイルとscripts/_diag_tier3_source_discovery.pyは削除する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: pip install -q -r requirements.txt

      - name: Bloomberg/Nikkei/JijiのRSS URLを調査
        run: python3 scripts/_diag_tier3_source_discovery.py
