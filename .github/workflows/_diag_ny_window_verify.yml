name: diag-ny-window-verify

# 一時的な調査用ワークフロー（v1.38「材料収集ウィンドウをNY 17:00基準へ
# 変更」のオーナー指示検証）。本番パイプライン（daily.yml・set_headline.yml・
# post_draft.yml）には一切影響しない。
# 調査完了後、本ファイルとscripts/_diag_ny_window_verify.pyは削除する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: pip install -q -r requirements.txt

      - name: NY 17:00基準ウィンドウで8/18 SEC・8/24 Base材料が拾えるか検証
        run: python3 scripts/_diag_ny_window_verify.py
