name: _diag-adp-live-verify

# ADP追加（v1.61・オーナー承認）のライブ検証専用の一時ワークフロー。
# オーナーの3点チェックリスト（雇用統計の取得・企業広報の正しい不採用・
# トークン消費への影響）を実データ・実LLM呼び出しで検証する。
# コミットは一切行わない。調査完了後、スクリプトとあわせて削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: |
          pip install -q -r requirements.txt

      - name: 診断スクリプト実行（実LLM呼び出しあり・コミットしない）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/_diag_adp_live_verify.py
