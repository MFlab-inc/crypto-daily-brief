name: _diag-notable-move-verify

# v1.41フォローアップ実データ検証専用の一時ワークフロー。恒久機能ではない。
# 実際のAnthropic APIを呼び出すが、コミットは一切行わない
# （outputs/2026-08-25/daily_data.jsonへの変更はこのジョブのローカル
# ディスク上のみで、リポジトリへは反映されない）。調査完了後、
# スクリプトとあわせて削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: |
          pip install -q -r requirements.txt

      - name: 診断スクリプト実行（実Anthropic APIを使用・コミットしない）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/_diag_notable_move_verify.py
