name: diag-tier1-body-and-tier3-limit

# 一時的な調査用ワークフロー（8/25実データで判明した2つの構造的問題の
# 対応案検討・オーナー指示）。本番パイプライン（daily.yml・
# set_headline.yml・post_draft.yml）には一切影響しない。
# 調査完了後、本ファイルとscripts/_diag_tier1_body_and_tier3_limit.pyは
# 削除する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: pip install -q -r requirements.txt

      - name: tier1本文取得の実現可能性・TIER3_CANDIDATE_LIMIT引き上げの影響を検証
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/_diag_tier1_body_and_tier3_limit.py
