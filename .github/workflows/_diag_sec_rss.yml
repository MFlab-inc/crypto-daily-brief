name: diag-sec-rss

# 一時的な調査用ワークフロー（③ SEC RSS 0件問題の診断・DESIGN_CHANGES.md参照）。
# 本番パイプライン（daily.yml・set_headline.yml・post_draft.yml）には一切影響しない。
# サンドボックス環境からsec.govへ到達できないため、フルインターネットアクセスを
# 持つGitHub Actionsランナー上でフィードの実レスポンスを取得する。
# 調査完了後、本ファイルとscripts/_diag_sec_rss.pyは削除する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: pip install -q requests

      - name: SEC RSSフィードの実レスポンスを取得・診断
        run: python3 scripts/_diag_sec_rss.py

      - name: 本番collect_news.pyでtarget_date=2026-08-19の候補を検証（タイムゾーン境界仮説の確認）
        working-directory: scripts
        run: |
          python3 -c "
          import json
          import collect_news
          result = collect_news.collect_news('2026-08-19')
          print('=== source_status ===')
          print(json.dumps(result['source_status'], ensure_ascii=False, indent=2))
          print()
          print('=== SEC発の候補一覧（target_date=2026-08-19） ===')
          sec_cands = [c for c in result['candidates'] if c['source'] == 'SEC']
          for c in sec_cands:
              print(json.dumps(c, ensure_ascii=False, indent=2))
          print(f'SEC候補件数: {len(sec_cands)}')
          "
