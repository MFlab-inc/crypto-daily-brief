name: diag-abc-classification-verify

# 一時的な調査用ワークフロー（v1.33「重要性判定と因果表現の分離」の
# オーナー指示検証）。本番パイプライン（daily.yml・set_headline.yml・
# post_draft.yml）には一切影響しない。
# 調査完了後、本ファイルとscripts/_diag_abc_classification_verify.pyは削除する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: pip install -q -r requirements.txt

      - name: 8/21・8/22データでA/B/C分類の効果を検証
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/_diag_abc_classification_verify.py
