name: _diag-rss-limit-investigate

# CoinDesk・Cointelegraph RSSの取得件数を増やすパラメータの有無を実測する
# 一時ワークフロー（8/30 C22 FAIL調査のフォローアップ・オーナー指示）。
# LLMは呼ばない。コミットは一切行わない。調査完了後、スクリプトと
# あわせて削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: |
          pip install -q -r requirements.txt

      - name: 診断スクリプト実行(実RSSへ複数パラメータで試行・LLM呼び出しなし・コミットしない)
        run: |
          python scripts/_diag_rss_limit_investigate.py
