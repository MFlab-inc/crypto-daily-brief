name: _diag-c22-0830-investigate

# 2026-08-30のC22 FAIL原因調査専用の一時ワークフロー（オーナー指示）。
# 実失敗回（run_id=33339632874）が残したデバッグ用アーティファクト
# （post-draft-2026-08-30, artifact_id=9740143390）をこのジョブ上から
# GitHub REST API経由でダウンロードし、実際のaudit_ledgerを確認する。
# LLMは呼ばない。コミットは一切行わない。調査完了後、スクリプトと
# あわせて削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: |
          pip install -q -r requirements.txt

      - name: 診断スクリプト実行(過去アーティファクトをダウンロード・LLM呼び出しなし・コミットしない)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/_diag_c22_0830_investigate.py
