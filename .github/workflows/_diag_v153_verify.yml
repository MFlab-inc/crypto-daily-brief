name: _diag-v153-verify

# v1.53実データ検証専用の一時ワークフロー。恒久機能ではない。
# 実際のAnthropic API・実RSSフィード・実経済カレンダーJSONを呼び出すが、
# コミットは一切行わない。調査完了後、スクリプトとあわせて削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係
        run: |
          pip install -q -r requirements.txt

      - name: 診断スクリプト実行（実Anthropic API・実RSS・実経済カレンダーを使用・コミットしない）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/_diag_v153_verify.py
