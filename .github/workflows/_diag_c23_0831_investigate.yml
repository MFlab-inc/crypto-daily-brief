name: _diag-c23-0831-investigate

# 2026-08-31のC23 FAIL原因調査専用の一時ワークフロー（本日分の状況確認）。
# 実失敗回（run_id=33447040302）が残したデバッグ用アーティファクト
# （post-draft-2026-08-31, artifact_id=9778439008）をこのジョブ上から
# GitHub REST API経由でダウンロードし、実際のpart1_points・part2_summary
# を確認する。LLMは呼ばない。コミットは一切行わない。調査完了後、
# スクリプトとあわせて削除する。

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 診断スクリプト実行(過去アーティファクトをダウンロード・LLM呼び出しなし・コミットしない)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/_diag_c23_0831_investigate.py
